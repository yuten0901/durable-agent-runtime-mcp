<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="420" viewBox="0 0 1040 420" role="img" aria-labelledby="title desc">
  <title id="title">Durable agent runtime flow</title>
  <desc id="desc">A planner coordinates two collectors, analysis, verification and publication. Every transition is checkpointed in SQLite and exposed through MCP tools.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#60a5fa"/>
    </marker>
    <style>
      .card { fill: #111827; stroke: #334155; stroke-width: 1.5; filter: url(#shadow); }
      .label { fill: #e5e7eb; font: 600 16px system-ui, sans-serif; text-anchor: middle; }
      .small { fill: #94a3b8; font: 13px system-ui, sans-serif; text-anchor: middle; }
      .line { fill: none; stroke: #60a5fa; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1040" height="420" rx="24" fill="url(#bg)"/>
  <text x="52" y="52" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="25" font-weight="700">Checkpointed agent orchestration</text>
  <text x="52" y="80" fill="#93c5fd" font-family="system-ui, sans-serif" font-size="14">MCP tools · durable checkpoints · bounded retries · auditable trace</text>

  <rect class="card" x="55" y="145" width="150" height="78" rx="14"/>
  <text class="label" x="130" y="178">Planner</text><text class="small" x="130" y="201">dependency graph</text>
  <rect class="card" x="270" y="108" width="165" height="70" rx="14"/>
  <text class="label" x="352" y="137">Registry agent</text><text class="small" x="352" y="158">retry-safe actor</text>
  <rect class="card" x="270" y="213" width="165" height="70" rx="14"/>
  <text class="label" x="352" y="242">News agent</text><text class="small" x="352" y="263">stable run ID</text>
  <rect class="card" x="505" y="145" width="150" height="78" rx="14"/>
  <text class="label" x="580" y="178">Analysis</text><text class="small" x="580" y="201">dedupe + classify</text>
  <rect class="card" x="715" y="145" width="135" height="78" rx="14"/>
  <text class="label" x="782" y="178">Verifier</text><text class="small" x="782" y="201">evidence gate</text>
  <rect class="card" x="910" y="145" width="95" height="78" rx="14"/>
  <text class="label" x="957" y="178">JSON</text><text class="small" x="957" y="201">sandbox</text>

  <path class="line" d="M205 173 C230 173 240 143 270 143"/>
  <path class="line" d="M205 195 C230 195 240 248 270 248"/>
  <path class="line" d="M435 143 C470 143 470 173 505 173"/>
  <path class="line" d="M435 248 C470 248 470 195 505 195"/>
  <path class="line" d="M655 184 L715 184"/>
  <path class="line" d="M850 184 L910 184"/>

  <rect x="210" y="330" width="620" height="54" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="520" y="352" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">Every completed step → SQLite checkpoint + structured trace</text>
  <text x="520" y="373" fill="#86efac" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">Fresh runtime objects resume pending work without repeating the committed checkpoint</text>
  <path d="M520 330 L520 245" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 6"/>
</svg>
