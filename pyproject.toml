[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime-demo"
version = "0.2.0"
description = "Offline proof of checkpointed, auditable multi-agent workflow orchestration"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["agents", "mcp", "workflow", "checkpoint", "sqlite"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "mypy>=1.11",
    "setuptools>=68",
    "wheel>=0.41",
]

[project.scripts]
agent-runtime-demo = "agent_runtime_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_runtime_demo = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "ARG", "RET", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tools/verify_release.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
